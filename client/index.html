<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Runtime Chat</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="Chat agent">
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">AI</div>
            <div>
              <div class="title-row">
                <h1>AI Runtime Chat</h1>
                <span class="status-badge"><span class="status-dot"></span> Online</span>
              </div>
              <p id="sessionLabel">Session loading...</p>
            </div>
          </div>
          <button id="resetButton" class="reset-button" type="button" title="Reset session" aria-label="Reset session">
            Reset
          </button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Message the agent" required></textarea>
          <button id="sendButton" type="submit" title="Send message" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
          <button id="stopButton" type="button" title="Stop generating" aria-label="Stop generating" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
